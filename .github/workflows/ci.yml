name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PR のコードを実行するジョブなので読み取りのみ(guidelines/monorepo.md MR-61)
permissions:
  contents: read

env:
  VP_GIT_HOOKS: '0' # CI では git hooks(prepare の vp hooks enable)を入れない

jobs:
  check:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager から読む
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # format + lint(型情報つき) + 型チェック
      - run: pnpm exec vp check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration テスト(Vitest Browser Mode)用の Chromium
      - run: pnpm --filter @ponmoji/web exec playwright install --with-deps chromium
      - run: pnpm exec vp run -r test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run -r build
